name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  native:
    name: native (ctest + real4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S AlgorithmLcr -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizer:
    name: sanitizer (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S AlgorithmLcr -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g0 -O1"
      - name: Build core tests
        run: cmake --build build-san -j2 --target lcr_tests
      - name: Run under sanitizers
        run: ASAN_OPTIONS=detect_leaks=1 ./build-san/lcr_tests

  wasm-frontend:
    name: wasm + frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Emscripten 6.0.9
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native CLI (for parity gate)
        run: |
          cmake -S ../AlgorithmLcr -B /tmp/lcr-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/lcr-native -j2 --target lcr
      - name: Rebuild wasm from current sources
        run: pnpm build:wasm
      - name: Committed artifacts must match the rebuild
        run: git diff --exit-code -- src/wasm
      - name: WASM smoke
        run: pnpm test:wasm
      - name: Native <-> WASM parity
        run: pnpm test:parity
        env:
          LCR_NATIVE_BIN: /tmp/lcr-native/lcr
      - name: Vitest
        run: pnpm test
      - name: Type-check and build
        run: pnpm build

  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest

  firmware:
    name: firmware (esp32s3 compile + static gates + host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
      - name: Install esp32 core 3.3.11 + TFT_eSPI 2.5.43
        run: |
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install TFT_eSPI@2.5.43
      - name: Static gates (no Classic BT / GPIO centralized / no stubs)
        run: bash ino/tools/static_check.sh
      - name: ESP32-S3 production compile
        run: bash ino/tools/build_check.sh
      - name: Host unit tests + golden CSV fixtures must match rebuild
        run: |
          bash ino/tools/run_tests.sh
          git diff --exit-code -- frontend/src/lib/__tests__/fixtures/golden_oneport.csv frontend/src/lib/__tests__/fixtures/golden_twoport.csv

  browser:
    name: browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps
      - name: Build site
        run: pnpm build
      - name: Serve and smoke
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          trap 'kill %1' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/ >/dev/null
          node scripts/browser-smoke.mjs
